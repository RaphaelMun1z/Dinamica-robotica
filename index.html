 const step=steps[page],sec=el('section','slide');
 if(phase==='remove'){
  next.style.display='none';sec.append(el('h2','','Remoção do circuito'),el('p','lead',`Cor escolhida: ${selected}. Remova o fio correspondente no dispositivo.`));const panel=el('div','panel');panel.append(el('p','','Depois de retirar o fio, confirme a remoção para executar a verificação.'));panel.append(button('Fio removido — verificar','primary',verifyRemoval));sec.append(panel);screen.append(sec);return;
 }
 if(phase==='result'){
  next.style.display='none';const sec=el('section','slide critical-screen '+(resultCorrect?'success':'failure'));sec.append(el('span','material-symbols-outlined critical-icon',resultCorrect?'check_circle':'dangerous'));sec.append(el('h2','',resultCorrect?'CIRCUITO ISOLADO':'FALHA CRÍTICA'));sec.append(el('p','lead',resultCorrect?'Sinal estabilizado. O acesso ao próximo circuito foi liberado.':'Sequência incorreta. O núcleo entrou em colapso. Operação encerrada.'));sec.append(button(resultCorrect?(page===4?'Concluir operação':'Prosseguir'):'Reiniciar operação',resultCorrect?'primary critical-action':'danger critical-action',resultCorrect?advance:restart));screen.append(sec);return;
 }
 next.textContent='Confirmar cor';next.disabled=!selected;
 sec.append(el('h2','',step.title),el('p','story',step.story));const panel=el('div','panel');panel.append(el('p','',step.challenge));if(step.code)panel.append(el('pre','code',step.code));sec.append(panel);
 const hints=el('div','hints');for(let ii=0;ii<3;ii++){
  const open=openedHints[page].includes(ii),card=el('div','hint'+(open?'':' locked'));
  card.append(el('span','num',`DICA ${ii+1}`));
  if(open){card.append(el('p','',step.hints[ii]))}
  else{
   const isNext=ii===openedHints[page].length;
   let label='Bloqueada';
   if(hintsUsed>=MAX_DICAS)label='Limite de dicas atingido';
   else if(isNext&&isHintAvailable())label='Abrir dica';
   else if(isNext)label=`Disponível em ${formatClock(hintWait())}`;
   card.append(el('p','',label));
   const b=button('Revelar','secondary',()=>openHint(ii));b.disabled=!isNext||!isHintAvailable();card.append(b);
  }hints.append(card);
 }sec.append(hints);
 const choice=el('div','choice');choice.append(el('p','','Qual fio deve ser removido?'));const opts=el('div','color-options');for(const color of colorOrder){const b=button(color,'color-button'+(selected===color?' chosen':''),()=>{selected=color;render()});const dot=el('span','dot');dot.style.background=({PRETO:'#171717',AMARELO:'#eab308',VERDE:'#22c55e',VERMELHO:'#ef4444',AZUL:'#3b82f6'})[color];b.prepend(dot);opts.append(b)}choice.append(opts);sec.append(choice);screen.append(sec);
}
next.addEventListener('click',()=>{
 if(page===-1){startedAt=Date.now();page=0;phase='challenge';enterStage()}
 else if(phase==='challenge'&&selected)phase='remove';
 render();
});
back.addEventListener('click',()=>{if(page===0&&phase==='challenge'){restart()}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&document.activeElement===document.body&&!next.disabled&&next.style.display!=='none')next.click()});
setInterval(()=>{
 if(startedAt===null||page===5||page===6||(phase==='result'&&!resultCorrect))return;
 if(elapsed()>=DURACAO_MISSAO_MS){failedByTime=true;page=6;render();return}
 const old=counter.textContent;
 counter.textContent=`TEMPO ${formatClock(DURACAO_MISSAO_MS-elapsed())}   •   DICAS ${hintsUsed}/${MAX_DICAS}`;
 if(phase==='challenge'){
   const current=screen.querySelectorAll('.hint.locked');
   // Atualiza contagens regressivas sem remontar os controles de escolha.
   current.forEach(card=>{const p=card.querySelector('p');if(!p)return;
    if(p.textContent.startsWith('Disponível em'))p.textContent=`Disponível em ${formatClock(hintWait())}`;
   });
   if(isHintAvailable()&&current.length){const first=Array.from(current).find(c=>c.querySelector('p')?.textContent.startsWith('Disponível em'));if(first)render()}
 }
},500);
render();
</script></body></html>
